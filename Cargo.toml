[package]
name = "redlight"
version = "0.1.0"
edition = "2021"
description = "Listen to MIDI events and trigger IoT/API actions based on DAW recording state."
license = "MIT OR Apache-2.0"

[dependencies]
midir = "0.9"
cpal = "0.15"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dotenvy = "0.15"

[[bin]]
name = "redlight"
path = "src/main.rs"
