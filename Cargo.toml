[package]
name = "midi-lights"
version = "0.1.0"
edition = "2021"
description = "Rust translation of the midi-lights Go project — listen to MIDI (IAC Driver Bus 1) and trigger actions."
license = "MIT OR Apache-2.0"

# Optional metadata (fill in as desired)
# authors = ["Your Name <you@example.com>"]
# repository = "https://your.repo/url"


[dependencies]
midir = "0.9"
cpal = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "midi-lights"
path = "src/main.rs"
